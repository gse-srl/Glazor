name: release

# A tag such as v1.1.1 builds, tests and pushes both packages to nuget.org through Trusted Publishing.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write   # the OIDC token nuget.org trades for a one-hour API key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check the tag against the version
        run: |
          version=$(dotnet msbuild Glazor/Glazor.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Directory.Build.props"
            exit 1
          fi
      - run: dotnet build Glazor.slnx -c Release
      - run: dotnet test Glazor.Tests/Glazor.Tests.csproj -c Release --no-build
      - run: dotnet pack Glazor/Glazor.csproj -c Release --no-build -o artifacts
      - run: dotnet pack Glazor.EntityFrameworkCore/Glazor.EntityFrameworkCore.csproj -c Release --no-build -o artifacts
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      # Glazor first: Glazor.EntityFrameworkCore depends on it at exactly this version.
      - run: dotnet nuget push artifacts/Glazor.[0-9]*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - run: dotnet nuget push artifacts/Glazor.EntityFrameworkCore.*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
